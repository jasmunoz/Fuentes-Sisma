name: SonarQube Analysis

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

jobs:
  sonar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Dar permisos de ejecución
        run: |
          chmod +x util/makelib
          chmod +x util/makenet

      - name: Compilar librerías
        run: |
          cd util
          ./makelib

      - name: Compilar ejecutables
        run: |
          cd util
          ./makenet

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}